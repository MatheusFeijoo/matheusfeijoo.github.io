# Projects page, newest first. The first entry also appears in the "Projects" tile on the homepage.
# To add one: copy a block, paste it at the top and edit it.
#   kind: a short label (Data pipeline, Dashboard, Tool, Dataset, Research code...)
#   links: any number of buttons; label is the button text (code, paper, article, demo...). Leave links out if there are none.

- name: AEMET climate data collection
  year: "2026"
  kind: Data pipeline
  text: >-
    Python pipeline that downloads the station inventory and the historical daily climate records of the
    Spanish Meteorological Agency (AEMET OpenData) for one province, several, or all 52. It splits long
    date ranges into API-sized windows, rate-limits requests and retries on errors.
  tags: [Python, AEMET OpenData API, climate data, ETL]
  links:
    - label: code
      url: https://github.com/MatheusFeijoo/Aemet_collection

