---
layout: default
---
<main class="in post-page">
  <a class="back" href="{{ '/news/' | relative_url }}">← all news</a>
  <div class="post-meta"><span class="tag">{{ page.tag | default: 'News' }}</span><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%-d %b %Y' }}</time></div>
  <h1>{{ page.title }}</h1>
  <div class="post-body">{{ content }}</div>
  {% if page.link %}<a class="btn primary" href="{{ page.link }}" target="_blank" rel="noopener">{{ page.link_label | default: 'read more' }} ↗</a>{% endif %}
</main>
